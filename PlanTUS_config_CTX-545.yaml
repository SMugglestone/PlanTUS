# Transducer-specific variables ------------------------------------------------
# Maximum minimum, and optimal focal depth of transducer (in mm)
max_distance: 76.6
min_distance: 33.1
optimal_distance: 52.4
# Aperture diameter (in mm)
transducer_diameter: 65.0
# Maximum allowed angle for tilting of TUS transducer (in degrees)
max_angle: 10.0
# Offset between radiating surface and exit plane of transducer (in mm)
plane_offset: 10.82
# Additional offset between skin and exit plane of transducer (in mm;
# e.g., due to addtional gel/silicone pad)
additional_offset: 3.0
# Focal distance and corresponding FLHM values (both in mm) according to, e.g.,
# calibration report
focal_distance_list:
  - 33.1
  - 34.7
  - 36.8
  - 39.3
  - 42.4
  - 46.2
  - 50.8
  - 56.0
  - 61.8
  - 68.5
  - 76.6
# Focal length to half maximum (FLHM) values (in mm)
flhm_list:
  - 8.4
  - 9.3
  - 10.3
  - 11.6
  - 13.5
  - 16.1
  - 19.2
  - 22.8
  - 26.3
  - 30.2
  - 34.5
# User-defined metric weights --------------------------------------------------
# Note: each in [0,1], sum = 1
weight_skin_target_distances: 0.2
weight_skin_target_angles: 0.2
weight_skin_target_intersections: 0.2
weight_skin_skull_angles: 0.2
weight_skull_thickness: 0.2
# Additional options ------------------------------------------------------------
# Optional: base directory for PlanTUS' "PlanTUS/<ROI_name>" output folder
# (default: the m2m folder next to the .msh file)
# output_folder: /path/to/custom/output/base
# Optional: Taubin smoothing iterations for the skin surface (default 2, 0 = off)
# skin_smoothing_iterations: 2
# Optional: target conflict -- keep the beam away from region(s) that should not be sonicated (masks on the T1 grid).
# Masks are normally given on the command line (--conflict-mask FILE[,margin=MM][,mode=hard|soft][,weight=W], repeatable) or
# listed here. A placement whose beam (skin vertex -> target centre -> half the focal length past it) passes within `margin`
# of a mask is removed (hard) or penalised (soft). Everything is off unless a mask is given. See code/TargetConflict.py.
# target_conflict_masks: []              # e.g. [{path: /abs/dlpfc.nii.gz, margin: 5, mode: soft, weight: 2}]
# weight_target_conflict: 1.0            # exponent of the conflict factor in the composite (0 switches it off)
# target_conflict_margin: 3.0            # mm; default for masks that do not set their own
# target_conflict_mode: hard             # hard: any conflict removes the position. soft: penalised by beam length inside
# target_conflict_full_mm: 20.0          # soft mode: mm of beam inside a mask that gives utility 0
# target_conflict_beyond: null           # mm to follow the beam past the target; null = half the calibrated focal length
# Optional: target overlap (tube mode) -- for tube-like targets such as a white-matter tract, where aiming at the centroid is
# wrong. Every placement is aimed at the best point INSIDE the target; the score is the overlap of PlanTUS' focal zone with
# the target relative to the smaller of the two (a small target fully covered, or a focus neatly inside a large target,
# scores 1). Distance and tilt are measured to the chosen aim point. Positions below the minimum overlap are removed.
# Off unless switched on here or with --target-overlap [--min-overlap F]. See code/TargetOverlap.py.
# target_overlap: false
# target_overlap_min: 0.5                # fraction (0-1); positions below this overlap are removed
# focus_width_mm: 5.0                    # lateral width of the focal zone (PlanTUS draws it 5 mm wide)
# target_overlap_max_aims: 80            # aim points tried per position (the target's voxels thinned to this many)
